services:
  postgres:
    image: postgres:16-alpine
    container_name: oyaya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-oyaya}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_DB: ${DB_NAME:-oyaya_erp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432" # LAN-only; public traffic goes through Nginx
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-oyaya}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: oyaya-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./packages/api
    container_name: oyaya-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-oyaya}:${DB_PASSWORD:?}@postgres:5432/${DB_NAME:-oyaya_erp}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    expose:
      - "8902"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/index.js"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8902/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s

  worker:
    build:
      context: ./packages/api
    container_name: oyaya-worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-oyaya}:${DB_PASSWORD:?}@postgres:5432/${DB_NAME:-oyaya_erp}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    command: ["node", "dist/worker.js"]

  web:
    build:
      context: ./packages/web
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: oyaya-web
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy

  backup:
    image: postgres:16-alpine
    container_name: oyaya-backup
    restart: unless-stopped
    environment:
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      PGUSER: ${DB_USER:-oyaya}
      PGHOST: postgres
      PGDATABASE: ${DB_NAME:-oyaya_erp}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - pgbackups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        while true; do
          STAMP=$(date +%Y%m%d-%H%M%S);
          pg_dump --format=custom --compress=9 -f /backups/oyaya_erp-$STAMP.dump && \
            echo "backup ok: oyaya_erp-$STAMP.dump";
          find /backups -maxdepth 1 -name 'oyaya_erp-*.dump' -mtime +$BACKUP_RETENTION_DAYS -delete;
          sleep $((BACKUP_INTERVAL_HOURS * 3600));
        done

  nginx:
    image: nginx:1.27-alpine
    container_name: oyaya-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP:-80}:80"
      - "${NGINX_HTTPS:-443}:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  pgbackups:
