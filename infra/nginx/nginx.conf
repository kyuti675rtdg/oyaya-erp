# Oyaya ERP — Nginx reverse proxy (main config, mounted as /etc/nginx/nginx.conf)
# Serves: PWA + API + Socket.io + ZKTeco ADMS on :80 (LAN), and TLS 1.3 on :443.
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 10m;

  # ZKTeco terminals can push large ATTLOG batches
  client_body_buffer_size 128k;

  upstream oyaya_api { server api:8902; }
  upstream oyaya_web { server web:80; }

  # ── LAN / plain HTTP (factory floor, ZKTeco HTTP push) ──────────
  server {
    listen 80;
    server_name _;

    # ZKTeco ADMS push (plain-text protocol, no auth by design)
    location /iclock {
      proxy_pass http://oyaya_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 60s;
    }

    # REST API
    location /api/ {
      proxy_pass http://oyaya_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Real-time bus
    location /socket.io/ {
      proxy_pass http://oyaya_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    # PWA
    location / {
      proxy_pass http://oyaya_web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  # ── Public TLS 1.3 (web UI, API, AfroMessage callbacks) ──────────
  # Certificates: /etc/nginx/certs/erp.oyayaflour.com.crt + .key
  # The deploy script provisions a self-signed pair so TLS is always on;
  # replace with a Let's Encrypt certificate for public trust (see infra/ops.md).
  server {
    listen 443 ssl;
    server_name erp.oyayaflour.com;

    ssl_protocols TLSv1.3;
    ssl_certificate     /etc/nginx/certs/erp.oyayaflour.com.crt;
    ssl_certificate_key /etc/nginx/certs/erp.oyayaflour.com.key;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # AfroMessage delivery callbacks + public API + PWA
    location /api/ {
      proxy_pass http://oyaya_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location /socket.io/ {
      proxy_pass http://oyaya_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    location / {
      proxy_pass http://oyaya_web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
